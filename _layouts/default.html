<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var key = "devdocs-theme";
        var pref = localStorage.getItem(key) || "system";
        var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
        var resolved = pref === "system" ? (darkQuery.matches ? "dark" : "light") : pref;
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-preference", pref);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
        document.documentElement.setAttribute("data-theme-preference", "system");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{% if page.collection %}collection-{{ page.collection }} {% endif %}layout-{{ page.layout | default: 'default' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include header.html %}

  <main id="main-content" class="site-main{% if page.collection == 'docs' %} site-main--docs{% endif %}" tabindex="-1">
    {% if page.collection == 'docs' %}
      {{ content }}
    {% else %}
      <div class="container">
        {{ content }}
      </div>
    {% endif %}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if page.collection == "docs" %}
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
