<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{% if page.collection %}collection-{{ page.collection }} {% endif %}layout-{{ page.layout | default: 'default' }}">
  {% include header.html %}

  <main id="main-content" class="site-main" tabindex="-1">
    <div class="container{% if page.collection == 'docs' %} container--docs{% endif %}">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if page.collection == "docs" %}
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
