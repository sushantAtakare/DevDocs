<div
  class="docs-search"
  id="docs-search"
  role="search"
  data-search-index="{{ '/assets/search-index.json' | relative_url }}">
  <label class="docs-search__label" for="docs-search-input">Search documentation</label>
  <div class="docs-search__control">
    <span class="docs-search__icon" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5 13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <input
      type="search"
      id="docs-search-input"
      class="docs-search__input"
      placeholder="Search docs…"
      autocomplete="off"
      spellcheck="false"
      aria-controls="docs-search-results"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-haspopup="listbox">
    <button
      type="button"
      class="docs-search__clear"
      id="docs-search-clear"
      hidden
      aria-label="Clear search">
      Clear
    </button>
  </div>
  <ul
    class="docs-search__results"
    id="docs-search-results"
    role="listbox"
    aria-label="Search results"
    hidden></ul>
  <div class="docs-search__status visually-hidden" id="docs-search-status" aria-live="polite"></div>
</div>
