# DevDocs site configuration
# Production values target the GitHub Pages project site.
# For root-local serving, use: bundle exec jekyll serve --config _config.yml,_config.local.yml

title: DevDocs
description: >-
  A clean, modern developer documentation platform for API references,
  guides, and technical knowledge - built with Jekyll.
author: DevDocs Team
email: docs@devdocs.local

# GitHub Pages (project site): https://sushantAtakare.github.io/DevDocs/
# Templates must use the relative_url filter so assets and links respect baseurl.
url: "https://sushantAtakare.github.io"
baseurl: "/DevDocs"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: Asia/Kolkata

# Documentation collection - source files live in _docs/
collections:
  docs:
    output: true
    permalink: /docs/:name/

# Exclude build tooling and VCS from the generated site
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CONTRIBUTING.md
  - .gitignore
  - .git
  - .github

# Include static asset directories
include:
  - assets

# Default front matter applied to matching files
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: docs
    values:
      layout: docs

# Site-wide navigation (consumed by _includes/header.html)
navigation:
  - title: Home
    url: /
  - title: Documentation
    url: /docs/getting-started/
